name: 기능 추가
description: 새로 만들 기능이나 화면
title: "[기능] "
labels: ["enhancement"]
body:
  - type: textarea
    id: goal
    attributes:
      label: 목표
      description: 무엇을 왜 만드나요? 한두 문장으로 적어요.
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: 단계
      description: 개발 순서의 몇 단계에 속하나요?
      options:
        - 0. 준비
        - 1. 글 읽기
        - 2. 배포
        - 3. 글 쓰기와 첫 공개
        - 4. 회원
        - 5. 참여
        - 6. 다듬기
    validations:
      required: true
  - type: checkboxes
    id: area
    attributes:
      label: 영역
      options:
        - label: frontend
        - label: backend
        - label: infra
  - type: textarea
    id: tasks
    attributes:
      label: 할 일
      description: 체크 목록으로 나눠 적어요. 하나가 커밋 한두 개 크기면 적당해요.
      value: |
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 끝나는 기준
      description: 무엇이 되면 이 이슈를 닫을 수 있나요? 눈으로 확인할 수 있게 적어요.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 참고
      description: 기획에서 정한 규칙, 화면 시안, 관련 이슈 등
