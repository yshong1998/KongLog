name: 버그
description: 기대와 다르게 동작하는 것
title: "[버그] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 일어났나요
      description: 본 그대로 적어요.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 다시 만드는 방법
      description: 같은 문제를 다시 보려면 어떤 순서로 해야 하나요?
      value: |
        1. 
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 오류 메시지
      description: 원문 그대로 붙여요. 비밀번호나 키가 들어 있으면 지워요.
      render: text
  - type: dropdown
    id: where
    attributes:
      label: 어디서 일어났나요
      options:
        - 내 컴퓨터
        - 자동 검사 (GitHub Actions)
        - 배포된 서버
    validations:
      required: true
  - type: checkboxes
    id: area
    attributes:
      label: 영역
      options:
        - label: frontend
        - label: backend
        - label: infra
