# 서버용 구성. Caddy, Next.js, Spring Boot, PostgreSQL 네 가지를 함께 띄운다.
# 저장소 루트에서 실행한다. 같은 폴더의 .env에서 값을 읽는다(.env.example을 복사해 만든다).
#   docker compose -f infra/server/compose.yaml up -d
# 밖에 여는 포트는 Caddy의 80과 443뿐이다. DB와 앱은 컨테이너끼리만 통한다.
# 메모리 상한(mem_limit)은 2GB 서버 기준이다. 정한 이유는 infra/README.md에 있다.
# 로컬 개발용 DB(infra/local/compose.yaml)와 이름, 포트, 볼륨이 겹치지 않아 함께 띄울 수 있다.
name: konglog

# 로그가 디스크를 채우지 않게 컨테이너마다 10MB 파일 3개까지만 남긴다.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  caddy:
    image: caddy:2.11
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # HTTP/3는 UDP를 쓴다. 연결을 맺을 때 오가는 횟수가 줄어, 서버가 먼 곳(시드니)에 있을 때 첫 화면이 빨라진다.
      - "443:443/udp"
    environment:
      # Caddyfile이 읽는다. 내 컴퓨터에서는 localhost, 서버에서는 konglog.my.
      SITE_DOMAIN: ${SITE_DOMAIN:?SITE_DOMAIN을 .env에 넣는다}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 발급받은 인증서를 둔다. 지워지면 다시 발급받아야 하고, 발급 횟수에는 제한이 있다.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
      - backend
    mem_limit: 128m
    logging: *logging

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE를 .env에 넣는다}
    restart: unless-stopped
    environment:
      # Next.js 서버가 백엔드를 부를 때 쓰는 주소. backend는 아래 서비스의 이름이다.
      API_BASE_URL: http://backend:8080
      NODE_OPTIONS: --max-old-space-size=256
    depends_on:
      - backend
    mem_limit: 384m
    logging: *logging

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE를 .env에 넣는다}
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:?POSTGRES_DB를 .env에 넣는다}
      DB_USERNAME: ${POSTGRES_USER:?POSTGRES_USER를 .env에 넣는다}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 넣는다}
      # 힙(객체를 담는 공간)과 그 밖의 공간에 각각 상한을 둔다. 힙만 막으면 전체는 더 커진다.
      JAVA_TOOL_OPTIONS: >-
        -Xmx256m
        -XX:MaxMetaspaceSize=128m
        -XX:ReservedCodeCacheSize=64m
      # CORS_ALLOWED_ORIGINS는 넣지 않는다. 화면과 API가 같은 도메인이라 필요 없다.
    depends_on:
      db:
        # DB가 접속을 받을 준비가 된 뒤에 백엔드를 띄운다.
        condition: service_healthy
    mem_limit: 640m
    logging: *logging

  db:
    # 로컬(infra/local/compose.yaml), 자동 검사(.github/workflows/ci.yml)와 같은 주 버전을 쓴다.
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # 테이블은 백엔드의 Flyway가 만든다. 여기서 SQL 파일을 넣지 않는다.
    command:
      - postgres
      - -c
      - shared_buffers=96MB
      - -c
      - max_connections=30
    volumes:
      # 컨테이너를 다시 만들어도 데이터가 남는다. down -v를 쓰면 지워진다.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    logging: *logging

volumes:
  db-data:
  caddy-data:
  caddy-config:
