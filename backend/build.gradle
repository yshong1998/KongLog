plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.3'
}

group = 'my.konglog'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot가 관리하는 버전을 그대로 쓴다. 아래 의존성에 버전을 적지 않는 이유다.
    implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    // Lombok은 컴파일할 때만 쓴다. 쓰는 범위는 CLAUDE.md의 "코드 규칙"에 있다.
    compileOnly 'org.projectlombok:lombok'
    // annotationProcessor는 implementation의 버전 목록을 물려받지 않아 따로 걸어 준다.
    annotationProcessor platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    // 테스트는 전용 스키마를 쓴다. 설정은 src/test/resources/application-test.yaml에 있다.
    systemProperty 'spring.profiles.active', 'test'
}

tasks.named('bootRun') {
    // 로컬에서 띄울 때는 프론트 개발 서버(http://localhost:3000)가 브라우저에서 API를 부를 수 있게 한다.
    // 환경 변수 CORS_ALLOWED_ORIGINS가 있으면 그 값을 쓴다. 배포 환경은 bootRun을 쓰지 않으니 이 기본값이 없다.
    systemProperty 'konglog.cors.allowed-origins', System.getenv('CORS_ALLOWED_ORIGINS') ?: 'http://localhost:3000'
}
