# 테스트 전용 설정. build.gradle이 테스트를 돌릴 때 test 프로필을 켠다.
#
# 테스트는 로컬 DB 안의 konglog_test 스키마(테이블을 담는 별도 공간)만 쓴다.
# 개발하며 넣어 둔 글이 테스트 결과를 바꾸지 않고, 테스트가 그 글을 건드리지도 않는다.
spring:
  datasource:
    hikari:
      schema: konglog_test
  flyway:
    # 스키마가 없으면 Flyway가 만들고, 테이블 변경 파일도 이 스키마에 적용한다.
    default-schema: konglog_test
