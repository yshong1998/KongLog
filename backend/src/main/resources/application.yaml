spring:
  application:
    name: konglog-backend
  datasource:
    # 기본값은 infra/local/compose.yaml의 로컬 DB다. 배포 환경에서는 환경 변수로 바꾼다.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/konglog}
    username: ${DB_USERNAME:konglog}
    password: ${DB_PASSWORD:konglog}
  jpa:
    open-in-view: false
    hibernate:
      # 테이블은 Flyway가 만든다. JPA는 엔티티와 테이블이 맞는지 확인만 한다.
      ddl-auto: validate

server:
  port: 8080

konglog:
  cors:
    # 브라우저에서 API를 부를 수 있는 주소. 쉼표로 여러 개를 넣는다.
    # 기본값은 비어 있어서 어떤 주소도 허용하지 않는다. ./gradlew bootRun의 기본값은 build.gradle에 있다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

management:
  endpoints:
    web:
      exposure:
        include: health
